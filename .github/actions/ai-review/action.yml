# Composite action encapsulating the AI review so review.yml stays one
# readable job: setup → npm run review (packages/code-reviewer two-pass
# pipeline) → sticky comment upsert → verdict label flip. Posting steps run
# only when the review step succeeded (composite steps are sequential); the
# CLI's exit-code contract is exit 0 for ANY produced verdict (incl.
# "failed" — advisory data) and exit 1 for technical failure only. A technical
# failure REPLACES the sticky comment with a "did not complete" notice and
# removes ai-cr:passed (change `finder-sonnet`): until then a provider outage
# left the previous run's comment and label in place, so a failed run could sit
# under an old "passed" and read as "no remarks".
# The finder runs with a diff-scoped getFileContext tool (--source-root
# "$GITHUB_WORKSPACE": file reads restricted to the diff's paths); its loop
# budget defaults to 5 steps, tunable via the finder-max-steps input
# (mapped to REVIEW_FINDER_MAX_STEPS).
# A THIRD pass runs only when plan-file resolved to a non-empty plan: the
# implementation review judges the diff against that plan. It is advisory and
# fully isolated — its failure renders as a warning inside the same comment and
# never changes the exit code, the ai-cr:* labels, or the code review above.

name: AI Code Review
description: Two-pass AI review (finder + judge) over the PR diff, plus a plan-aware implementation review when a plan resolves; posts a sticky scorecard comment and flips ai-cr:* labels.

inputs:
  api-key:
    description: OpenRouter API key
    required: true
  review-model:
    description: Finder model override (maps to OPENROUTER_REVIEW_MODEL; empty = package default chain)
    required: false
    default: ""
  judge-model:
    description: Judge model override (maps to OPENROUTER_JUDGE_MODEL; empty = package default chain)
    required: false
    default: ""
  impl-review-model:
    description: Implementation-review model override (maps to OPENROUTER_IMPL_REVIEW_MODEL; empty = package default chain)
    required: false
    default: ""
  finder-max-steps:
    description: Finder tool-loop step budget override (maps to REVIEW_FINDER_MAX_STEPS; empty = package default of 5)
    required: false
    default: ""
  pr-title:
    description: Pull request title (untrusted metadata; passed via env, never interpolated into scripts)
    required: false
    default: ""
  pr-body:
    description: Pull request body (untrusted metadata; passed via env, never interpolated into scripts)
    required: false
    default: ""
  diff-file:
    description: Absolute path to the unified diff to review
    required: true
  project-context-file:
    description: Absolute path to trusted project review rules (must be sourced from the BASE branch, never the PR head); empty or empty-file = no rules
    required: false
    default: ""
  plan-file:
    description: Absolute path to the plan this PR implements (UNTRUSTED PR-head content; the caller must stage it from the Git object after a blob-mode check, never read it through the checkout); empty or empty-file = no plan
    required: false
    default: ""
  plan-path:
    description: Repo-relative location of the plan, for display in the review comment (untrusted metadata; passed via env, never interpolated into scripts)
    required: false
    default: ""
  github-token:
    description: Token for the sticky comment + label steps (needs pull-requests write)
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: packages/code-reviewer/package-lock.json

    - name: Install package dependencies
      shell: bash
      working-directory: packages/code-reviewer
      run: npm ci

    - name: Run two-pass review
      id: review
      shell: bash
      working-directory: packages/code-reviewer
      env:
        OPENROUTER_API_KEY: ${{ inputs.api-key }}
        OPENROUTER_REVIEW_MODEL: ${{ inputs.review-model }}
        OPENROUTER_JUDGE_MODEL: ${{ inputs.judge-model }}
        OPENROUTER_IMPL_REVIEW_MODEL: ${{ inputs.impl-review-model }}
        REVIEW_FINDER_MAX_STEPS: ${{ inputs.finder-max-steps }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        DIFF_FILE: ${{ inputs.diff-file }}
        PROJECT_CONTEXT_FILE: ${{ inputs.project-context-file }}
        PLAN_FILE: ${{ inputs.plan-file }}
        PLAN_PATH: ${{ inputs.plan-path }}
      run: |
        ARGS=(--diff-file "$DIFF_FILE" --out-dir .review-out --source-root "$GITHUB_WORKSPACE")
        if [[ -n "$PROJECT_CONTEXT_FILE" ]]; then
          ARGS+=(--project-context-file "$PROJECT_CONTEXT_FILE")
        fi
        # Omitted when no plan resolved, so a plan-less run is byte-identical
        # to the pre-feature invocation. PLAN_PATH rides in via env, never as
        # an argument — it is untrusted (the PR body can name the plan).
        if [[ -n "$PLAN_FILE" ]]; then
          ARGS+=(--plan-file "$PLAN_FILE")
        fi
        npm run review -- "${ARGS[@]}"

    - name: Upsert sticky comment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BODY_FILE: packages/code-reviewer/.review-out/comment.md
      run: |
        # Marker-based lifecycle: find the existing comment by STICKY_MARKER
        # (rendered into comment.md by the package) → PATCH, else POST.
        # Only match OUR bot's comment — a user pasting the public marker
        # string must not be able to hijack the upsert target (impl-review F1).
        MARKER="<!-- ai-cr:sticky -->"
        EXISTING_ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
          --paginate --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$MARKER\"))) | .id" | head -1)
        if [[ -n "$EXISTING_ID" ]]; then
          echo "Updating sticky comment $EXISTING_ID"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING_ID}" \
            -F body=@"$BODY_FILE" > /dev/null
        else
          echo "Creating sticky comment"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -F body=@"$BODY_FILE" > /dev/null
        fi

    - name: Flip verdict label
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        VERDICT=$(jq -r .verdict packages/code-reviewer/.review-out/review.json)
        if [[ "$VERDICT" == "passed" ]]; then
          ADD="ai-cr:passed"; REMOVE="ai-cr:failed"
        else
          ADD="ai-cr:failed"; REMOVE="ai-cr:passed"
        fi
        echo "verdict=$VERDICT → +$ADD -$REMOVE"
        # Add must succeed BEFORE the opposite label is removed — otherwise a
        # transient API failure leaves the PR with no verdict label at all
        # while the job reports green (impl-review F2). A failed add fails the
        # step red; the old label survives as the last valid verdict. Remove
        # stays tolerant: an absent opposite label is normal on first runs.
        gh pr edit "$PR_NUMBER" --add-label "$ADD"
        gh pr edit "$PR_NUMBER" --remove-label "$REMOVE" || true

    # A technical failure must not look like a result. Fires when the review
    # did not succeed — it failed, or an earlier step (setup, npm ci) failed
    # and it never ran — and NOT when the review succeeded and only a posting
    # step above failed: then the review's own outcome is on its way and a
    # notice would overwrite it. The job stays red either way; this step only
    # changes what the PR shows.
    - name: Replace the verdict with a failure notice
      if: failure() && steps.review.outcome != 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        # Same marker and the same bot filter as the success path, so the next
        # successful run PATCHes this notice away like any other sticky body.
        MARKER="<!-- ai-cr:sticky -->"
        RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        BODY_FILE="$RUNNER_TEMP/ai-review-failure.md"
        {
          printf '%s\n' "$MARKER"
          printf '%s\n\n' "## ⚠️ AI review did not complete — no verdict"
          printf '%s\n\n' "The automated review of commit \`${HEAD_SHA:0:7}\` **failed before it produced a result**. This is a technical failure, not a review outcome: it is **not a pass**, and it does **not** mean the reviewer found nothing to remark on."
          printf '%s\n\n' "Any earlier AI verdict on this PR is withdrawn and the \`ai-cr:passed\` label has been removed. Treat this PR as not AI-reviewed until a run completes."
          printf '%s\n' "- Run log: ${RUN_URL}"
          printf '%s\n' "- To retry, add the \`ai-cr:review\` label."
        } > "$BODY_FILE"
        EXISTING_ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
          --paginate --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$MARKER\"))) | .id" | head -1)
        if [[ -n "$EXISTING_ID" ]]; then
          echo "Replacing sticky comment $EXISTING_ID with the failure notice"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING_ID}" \
            -F body=@"$BODY_FILE" > /dev/null
        else
          echo "Posting the failure notice as the sticky comment"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -F body=@"$BODY_FILE" > /dev/null
        fi
        # Tolerant: absent on a first run or after a failed verdict. Never
        # ai-cr:failed — a failure is not a verdict, and that label means the
        # review ran and judged the change.
        gh pr edit "$PR_NUMBER" --remove-label "ai-cr:passed" || true
