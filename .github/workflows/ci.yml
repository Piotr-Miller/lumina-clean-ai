name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs to save Actions minutes: pushing a new commit to a PR
# branch aborts that branch's in-flight run instead of letting it finish. Scoped
# per ref. master is deliberately EXCLUDED from cancellation (cancel-in-progress
# false on refs/heads/master) so a merge's deploy run is never killed mid-flight
# by a follow-up push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      # Formatting is gated repo-wide, NOT per-graph. `npm run lint` only
      # covers the root ESLint project; packages/code-reviewer and
      # supabase/functions are deliberately outside it (own configs, own
      # jobs), so for months nothing kept them formatted and a plain
      # `npm run format` rewrote 28 files of unrelated churn. Prettier does
      # not need the ESLint/tsc project graph, so a graph exclusion was never
      # a reason to leave maintained source ungoverned — this check reaches
      # everything .prettierignore does not deliberately protect.
      - run: npm run format:check
      # Pure unit tests only (incl. the /callback hardening suite). The
      # jobs.rls.test.ts integration suite runs in the `integration` job below
      # (it needs Docker + a local Supabase); see tests/README.md.
      - run: npm run test:unit
      # Static-check the Deno Edge Function on every push AND PR. supabase/
      # functions/** is excluded from the Astro tsc/eslint graph (see
      # context/foundation/lessons.md), so `deno check` is its ONLY static
      # coverage — and running it here (not just in `deploy`) gates PRs too.
      # --config is required: run from the repo root, deno would otherwise
      # discover no deno.json (none at root) and resolve bare specifiers from
      # the app's node_modules (installed by `npm ci`). That hides @sentry/deno,
      # which lives ONLY in the function's import map — yielding a spurious
      # "not a dependency" error. Pointing at the function's deno.json loads its
      # import map so the npm:@sentry/deno specifier resolves.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The whole directory, not just index.ts: the extracted side-effect-free
      # modules and their tests must be type-checked too, or a break in them
      # would only surface at `deno test` (or, worse, at deploy).
      - run: deno check --config supabase/functions/enhance/deno.json supabase/functions/enhance/
      # Behavioural coverage for the Edge Function (change
      # `edge-function-test-harness`). Until this existed, `deno check` plus a
      # stubbed E2E was the function's entire coverage — and the E2E Replicate
      # stub never returns 429, so the burst-limit retry shipped unexercised.
      # Hermetic: fetch/sleep are injected, so no network, no secrets, no real
      # backoff waiting — fork-PR-safe and fast.
      - run: deno test --config supabase/functions/enhance/deno.json supabase/functions/enhance/
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  integration:
    # Full Vitest suite INCLUDING tests/jobs.rls.test.ts, which deliberately
    # does not mock Supabase — it hits an ephemeral local stack (Docker) to
    # lock RLS / storage / retention against a real runtime.
    #
    # This is a SEPARATE job on purpose: the local credentials it writes to
    # $GITHUB_ENV must never share a process with the `ci` job's prod-secret
    # `build` step, or the build would silently run against the local stack.
    # No GitHub secrets are used here — `supabase start` generates the local
    # keys — so this job also runs on fork PRs.
    runs-on: ubuntu-latest
    # Bound a pathological hang (a wedged container after the boot retry, or a
    # stuck `npm test`). This job gates `deploy` via `needs:`, so failing fast
    # beats leaving a deploy pending under GitHub's default 360-min timeout.
    # Observed wall-clock is ~2-4 min; 15 is generous headroom.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Cache the Supabase service images (all pulled from public.ecr.aws) across
      # runs. The root cause of intermittent `error running container: exit 1`
      # failures here was the anonymous-pull rate limit on that registry
      # (`toomanyrequests: Rate exceeded`) — GitHub-hosted runners share egress
      # IPs, so cold pulls of ~14 images get throttled. Restoring from cache means
      # `supabase start` / `db reset` find the images locally and skip the pull.
      # Key on the lockfile (pins the supabase CLI → image tags) + config.toml.
      - name: Cache Supabase Docker images
        id: supabase-images
        uses: actions/cache@v5
        with:
          path: ~/supabase-images
          key: supabase-images-${{ runner.os }}-${{ hashFiles('package-lock.json', 'supabase/config.toml') }}
      - name: Load cached Supabase images
        if: steps.supabase-images.outputs.cache-hit == 'true'
        run: |
          shopt -s nullglob
          for tar in ~/supabase-images/*.tar; do
            docker load -i "$tar"
          done
      # `supabase start` boots Postgres + Auth + Storage in Docker (~1-2 min on a
      # cold image pull; near-instant on a cache hit). Retry once after a clean
      # stop so a transient Docker/image-pull hiccup doesn't false-fail the job —
      # and, since `deploy` needs this job, doesn't false-block a deploy.
      # `--no-backup` deletes the data volumes so the retry boots clean.
      - name: Start local Supabase (retry once on transient boot failure)
        run: |
          npx supabase start || {
            echo "::warning::supabase start failed; stopping and retrying once"
            npx supabase stop --no-backup || true
            npx supabase start
          }
      # On a cache miss, persist the freshly-pulled images so the next run's
      # restore step finds them. `actions/cache` saves ~/supabase-images in its
      # post-job step (only when the key was a miss). Grep on the public.ecr.aws
      # registry to capture every Supabase service image and nothing the runner
      # preloaded (those come from docker.io / ghcr / mcr).
      - name: Save Supabase images to cache
        if: steps.supabase-images.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/supabase-images
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -E 'public\.ecr\.aws|supabase/' \
            | while read -r img; do
                fname=$(echo "$img" | tr '/:' '__')
                docker save "$img" -o ~/supabase-images/"$fname.tar"
              done
      # Apply every migration → creates public.jobs + the private `photos`
      # storage bucket the suite needs. Mirrors the documented dev flow
      # (tests/README.md); no seed.sql exists, all test data is runtime-created.
      # Retry once on a transient container failure (same `toomanyrequests` /
      # flaky-boot class the `start` step guards against): `db reset` spins up a
      # fresh schema-init container, so it shares that exposure. `db reset`
      # recreates the database itself, so a bare retry is sufficient — no stop.
      - name: Apply migrations (retry once on transient container failure)
        run: |
          npx supabase db reset || {
            echo "::warning::supabase db reset failed; retrying once"
            npx supabase db reset
          }
      # Export the three vars tests/env.ts requires, renamed from the local
      # stack's status output (override-name keys are the documented config
      # paths — see `supabase status --help`). Safe to write to $GITHUB_ENV:
      # this job has no prod-secret step to bleed into.
      #
      # `-o env` wraps every value in double quotes (NAME="value"); $GITHUB_ENV
      # stores the line verbatim, so the quotes would become part of the value
      # and supabase-js rejects SUPABASE_URL as "not a valid HTTP/HTTPS URL".
      # Strip the surrounding quotes before appending (values are URLs/keys —
      # none contain an internal double-quote, so this is safe). Lines without
      # surrounding quotes pass through unchanged.
      - name: Export local Supabase credentials
        run: |
          npx supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | sed -E 's/^([A-Za-z_][A-Za-z0-9_]*)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"
      - run: npm test

  e2e:
    # Playwright browser-level gate on the north-star flow (risks #1+#6) and the
    # stall→terminal spec (risk #1 stall half). Like `integration`, it boots an
    # ephemeral local Supabase (Docker) and uses NO GitHub secrets — `supabase
    # start` generates the local keys — so it also runs on fork PRs. The Cloud-AI
    # pipeline is STUBBED end-to-end: the north-star spec POSTs a self-signed
    # Replicate `/callback` (no Replicate account, no token, no cold boot); the
    # stall spec relies on the DB webhook staying UNWIRED (the CI default), so a
    # submitted row sits `queued` until the client watchdog surfaces the timeout.
    # The live cold-boot path stays a manual smoke
    # (context/foundation/cloud-live-smoke.md), never a PR gate.
    runs-on: ubuntu-latest
    # Measured over 11 runs (2026-08-19): 5,6,6,6,7,8,9,9,9,13,18 min. The old
    # note here claimed "cold ~5-7, warm ~4-5", which the data contradicts — the
    # tail reached 18 min against this 20-min cap, and one run blew it entirely.
    # ALL of that spread was `playwright install --with-deps` (see the step
    # below); with apt gone the job should sit near the low end with real
    # headroom. The cap stays at 20 deliberately: it is NOT sized to absorb the
    # old tail, it exists so a wedged container/serve fails fast rather than
    # sitting at GitHub's 360-min default, and this job gates `deploy` via
    # `needs:`. If runs start approaching it again, that is a signal to
    # investigate, not to raise the number.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ——— Ephemeral local Supabase: same image-cache + retry hardening as the
      # `integration` job above (see that job's comments and lessons.md "Cache
      # Supabase CI images …" — anonymous public.ecr.aws pulls are rate-limited
      # on shared runners). Same cache key ⇒ this job and `integration` share the
      # restored image set.
      - name: Cache Supabase Docker images
        id: supabase-images
        uses: actions/cache@v5
        with:
          path: ~/supabase-images
          key: supabase-images-${{ runner.os }}-${{ hashFiles('package-lock.json', 'supabase/config.toml') }}
      - name: Load cached Supabase images
        if: steps.supabase-images.outputs.cache-hit == 'true'
        run: |
          shopt -s nullglob
          for tar in ~/supabase-images/*.tar; do
            docker load -i "$tar"
          done
      - name: Start local Supabase (retry once on transient boot failure)
        run: |
          npx supabase start || {
            echo "::warning::supabase start failed; stopping and retrying once"
            npx supabase stop --no-backup || true
            npx supabase start
          }
      - name: Save Supabase images to cache
        if: steps.supabase-images.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/supabase-images
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -E 'public\.ecr\.aws|supabase/' \
            | while read -r img; do
                fname=$(echo "$img" | tr '/:' '__')
                docker save "$img" -o ~/supabase-images/"$fname.tar"
              done
      - name: Apply migrations (retry once on transient container failure)
        run: |
          npx supabase db reset || {
            echo "::warning::supabase db reset failed; retrying once"
            npx supabase db reset
          }
      # Export the three local creds to BOTH targets:
      #   - $GITHUB_ENV  → the Playwright TEST process (tests/e2e/helpers/env.ts
      #     loopback guard + resolveSigningSecret read process.env);
      #   - .dev.vars    → the APP SERVER. Playwright's webServer is
      #     `npm run test:e2e:serve` = `npm run build && wrangler dev` (a
      #     production build served on workerd — NOT `astro dev`, whose Vite SSR
      #     dep-optimizer hits dev-only issue #15). `wrangler dev` reads .dev.vars
      #     for runtime secrets, NOT process.env (CLAUDE.md "Cloudflare local
      #     dev"). The build inherits this job's process env. .dev.vars is
      #     gitignored — generating it here is clean.
      # `-o env` wraps values in double quotes; $GITHUB_ENV stores the line
      # verbatim, so strip the surrounding quotes (URLs/keys carry no internal
      # quote). Same sed as `integration`.
      - name: Export local Supabase credentials (process env + .dev.vars)
        run: |
          npx supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | sed -E 's/^([A-Za-z_][A-Za-z0-9_]*)="(.*)"$/\1=\2/' > .supabase.env
          cat .supabase.env >> "$GITHUB_ENV"
          # E2E_CHROMA_OVERRIDE: LOCAL/CI-ONLY seam so the chroma-postpass-on spec can
          # opt into the post-pass via `?chroma=1` while every other spec stays OFF
          # (the flag's real default). Never set in production.
          { cat .supabase.env; echo "CLOUD_PIPELINE_ENABLED=false"; echo "E2E_CHROMA_OVERRIDE=true"; } > .dev.vars
          rm .supabase.env
      # The Edge Function's serve env (gitignored locally; generated here). The
      # STUBBED `/callback` needs only the signing secret + the E2E SSRF-allowlist
      # origin. The secret is generated per-run: a self-signing harness can never
      # validate the PROD secret anyway — that's the live smoke's job (lessons.md
      # "A self-signing local webhook harness can't catch a wrong provider secret").
      # SUPABASE_URL/SERVICE_ROLE_KEY are auto-injected by `functions serve` — do
      # NOT set them here.
      #
      # E2E_ALLOWED_OUTPUT_ORIGIN must equal the fixture server's advertised
      # origin. The spec advertises host.docker.internal:8787 (fixture-server.ts
      # default; the host is NOT spec-overridable, so the plan's 172.17.0.1
      # fallback is moot — CI matches the spec). The Supabase CLI maps
      # host.docker.internal → host-gateway on its managed containers, so the
      # edge-runtime container resolves it on a Linux runner too.
      # ⚠️ NEVER set E2E_ALLOWED_OUTPUT_ORIGIN in production — it widens the SSRF
      # output-fetch allowlist (default-off seam; see cloud-live-smoke.md).
      - name: Generate Edge Function serve env (stubbed pipeline)
        run: |
          mkdir -p supabase/functions
          {
            echo "REPLICATE_WEBHOOK_SIGNING_SECRET=whsec_$(openssl rand -base64 24)"
            echo "DB_WEBHOOK_SECRET=e2e-unused-on-callback"
            echo "CLOUD_PIPELINE_ENABLED=false"
            echo "E2E_ALLOWED_OUTPUT_ORIGIN=http://host.docker.internal:8787"
          } > supabase/functions/.env
      # Serve the function in the background (survives across steps — same
      # runner). The router's 404 on a bare GET IS the ready signal: any HTTP
      # response (code != 000) means the gateway is up. Env is read at serve
      # startup. Fail fast with the log if it never binds.
      - name: Serve the enhance Edge Function (background) + readiness probe
        run: |
          npx supabase functions serve enhance --env-file supabase/functions/.env \
            > "$RUNNER_TEMP/functions-serve.log" 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SUPABASE_URL/functions/v1/enhance" || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "enhance serve ready (HTTP $code)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::enhance Edge Function never became reachable at $SUPABASE_URL/functions/v1/enhance"
          cat "$RUNNER_TEMP/functions-serve.log" || true
          exit 1
      # Cache the chromium binary (keyed on the lockfile — pins @playwright/test →
      # browser build).
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # NO `--with-deps`, deliberately. Measured across 11 runs, this single step
      # was the entire source of this job's duration variance — 0.3 min on a good
      # run vs 13.6 min on a bad one (45x), while every other step, including the
      # tests themselves, stayed stable to within seconds. It blew the 20-minute
      # job cap outright on run 32293188132.
      #
      # The cache above never helped it: `--with-deps` runs apt-get for system
      # libraries, which is not cacheable, so a cache HIT still paid the apt cost.
      # ubuntu-latest ships Chrome and Firefox preinstalled, so chromium's shared
      # libraries are already on the image — which is why the good runs take 18
      # seconds.
      #
      # If a library really is missing, chromium fails to launch and the e2e specs
      # go red immediately and visibly — this cannot degrade silently, and the
      # revert is one word.
      - run: npx playwright install chromium
      # Playwright builds + serves the worker itself (webServer =
      # `npm run test:e2e:serve`, reuseExistingServer false) on :4321 — the
      # fixture-server's :8787 stays clear — then runs setup → seed/anon →
      # north-star → stall. CI=true (GitHub default) ⇒ retries: 1. The
      # fresh-stack Realtime cold-start flake is absorbed by the north-star
      # spec's own warmup precondition (tests/e2e/helpers/realtime-ready.ts) —
      # no extra CI step needed.
      - run: npm run test:e2e
      # The `webServer` boot flake (change `e2e-webserver-boot-flake`) reports
      # `[WebServer] ✘ [ERROR]` with an EMPTY message, which makes every
      # hypothesis about it unfalsifiable — three occurrences so far, each
      # answered with a re-run because nothing was left to read.
      #
      # But wrangler does write a detailed log, and says so in the very output we
      # already capture: `🪵 Logs were written to
      # /home/runner/.config/.wrangler/logs/wrangler-<timestamp>.log`. We were
      # discarding the one artifact that could explain the blank error. Collect it
      # on failure alongside the Playwright report.
      #
      # continue-on-error so a missing log directory (a failure that never reached
      # wrangler) cannot turn a real test failure into a confusing upload error.
      - name: Collect wrangler dev logs
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          mkdir -p wrangler-logs
          cp -r ~/.config/.wrangler/logs/. wrangler-logs/ 2>/dev/null || echo "no wrangler logs found"
          ls -la wrangler-logs/ || true
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            wrangler-logs/
            test-results/
          retention-days: 7
      # Flaky-green evidence (change `e2e-webserver-boot-flake`, sig 3): with
      # `retries: 1` a fail→retry-pass run is GREEN, so the `if: failure()` step
      # above uploads nothing — yet `trace: retain-on-failure` has kept the
      # FIRST attempt's trace in test-results/, which is exactly the evidence a
      # healed flake otherwise destroys. On a clean green run test-results/
      # holds no retained files, so `if-no-files-found: ignore` uploads nothing.
      - name: Upload flaky-run evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-flaky-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  code-reviewer:
    # Compensating remote gate for packages/code-reviewer (change tool-loop-agent):
    # the package is EXCLUDED from the root tsc/eslint graphs (own module graph —
    # same pattern as supabase/functions + `deno check`, see lessons.md), so this
    # job is its only CI coverage: own-lockfile install + lint + typecheck +
    # hermetic unit tests (no network, no secrets — fork-PR-safe). Deliberately
    # NOT in deploy.needs: the package is not part of the deployed Worker, and a
    # red package job must not block app deploys.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/code-reviewer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/code-reviewer/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: [ci, integration, e2e]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx astro sync
      # Unit tests run in `ci`; the full suite runs in `integration`; `deno
      # check` runs in `ci`. All three gate this job via `needs:` above, so
      # none are repeated here.
      # App → Cloudflare Workers. Worker runtime secrets were set once via
      # `wrangler secret put` (Phase 2 #5) and persist across deploys, so
      # CLOUD_PIPELINE_ENABLED=false / CLOUD_DAILY_CAP=0 stay authoritative.
      # The build still needs SUPABASE_URL/SUPABASE_KEY as build-time env.
      # v4 runs on Node 24 (v3 was Node 20 — forced off by GitHub 2026-06-16) and
      # defaults to Wrangler v4, matching the project's wrangler 4.x devDependency.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pre-deploy privacy guard (follow-up 3.7): the token-bearing build uploads
          # source maps to Sentry, then the SDK auto-deletes the emitted maps per-build.
          # If any client .map survives, refuse to deploy rather than ship source publicly.
          # NOTE: wrangler-action runs preCommands LINE-BY-LINE — the guard must be ONE line.
          preCommands: |
            npm run build
            test -z "$(find dist/client -name '*.map')" || { echo "::error::client source maps present in dist/client — refusing to deploy"; exit 1; }
          command: deploy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Sentry build-time env. SENTRY_AUTH_TOKEN drives source-map upload (the
          # @sentry/astro integration uploads during `npm run build` then cleans the
          # emitted maps). PUBLIC_SENTRY_DSN + PUBLIC_SENTRY_ENVIRONMENT are baked
          # into the client bundle (public by design). The SERVER DSN + environment
          # are Worker RUNTIME values (wrangler secret/var), not build-time — see
          # change.md runtime prerequisites. All optional: absent token → upload is
          # skipped, absent DSN → SDK no-ops.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          PUBLIC_SENTRY_ENVIRONMENT: production
      # Edge Function → Supabase. Use the version-pinned supabase CLI from
      # devDependencies via npx (deterministic — no unpinned global install).
      # --use-api forces API bundling (no Docker on the runner); the deploy
      # honors config.toml verify_jwt=false.
      - run: npx supabase functions deploy enhance --use-api --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # WHY THIS JOB EXISTS: `deploy` above is gated `needs: [ci, integration, e2e]`,
  # so any red gate on a master push silently SKIPS it. The run is already red —
  # that part is visible — but nothing anywhere says the thing that actually
  # matters: **production is now behind master**, and stays behind until someone
  # notices and re-runs.
  #
  # That is not hypothetical. On 2026-08-19 (run 32298488149) a flaky `e2e`
  # skipped the deploy after a merge, and a whole session's merged work sat
  # undeployed until it was spotted by chance. `deploy: skipping` in the checks
  # list is indistinguishable from the PR-run case, where skipping is correct and
  # expected — which is exactly why nobody looks twice at it.
  #
  # Deliberately an ALARM, not a gate change: it does not deploy, does not
  # override the gate, and does not make a red gate green. `e2e` catching a
  # genuinely broken north-star flow SHOULD stop a deploy; the defect was the
  # silence, not the gate. See change `deploy-gate-visibility`.
  deploy-skipped-alarm:
    needs: [ci, integration, e2e]
    # always() so this runs even though its dependencies failed — without it the
    # job would be skipped for the same reason `deploy` was, which is the bug.
    # Scoped to master pushes only: on PRs `deploy` is skipped by design and an
    # alarm there would be pure noise, training people to ignore it.
    if: >-
      ${{ always()
      && github.ref == 'refs/heads/master'
      && github.event_name == 'push'
      && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Announce that production is now behind master
        run: |
          {
            echo "## ⚠️ Deploy was skipped — production is behind master"
            echo
            echo "A required gate failed on a master push, so the \`deploy\` job did not run."
            echo "**The Worker and the \`enhance\` Edge Function are still serving the previous commit.**"
            echo
            echo "| gate | result |"
            echo "| --- | --- |"
            echo "| ci | ${{ needs.ci.result }} |"
            echo "| integration | ${{ needs.integration.result }} |"
            echo "| e2e | ${{ needs.e2e.result }} |"
            echo
            echo "Commit \`${GITHUB_SHA}\` is on master but NOT deployed."
            echo
            echo "**If the failure was a flake**, re-run the failed jobs — the deploy runs automatically once they pass."
            echo "**If it was real**, production is correctly protected; fix forward and merge again."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Deploy skipped — production is behind master::Commit ${GITHUB_SHA} merged but was NOT deployed (a required gate failed). Re-run the failed job if it was a flake; the deploy runs automatically once the gates pass."
          exit 1
